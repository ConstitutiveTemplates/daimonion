name: daimonion
description: Scan git diffs and files against legal and ethical triggers.
inputs:
  strict:
    description: Fail the job when a structural L2 rule triggers. New projects should start with adoption mode instead.
    required: false
    default: "false"
  adoption:
    description: Warn-only adoption mode; report findings but never fail the job (overrides strict).
    required: false
    default: "true"
  args:
    description: Arguments passed to daimonion (e.g. "scan" or "scan src/"), split on whitespace.
    required: false
    default: scan
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

    # Inputs reach the shell only through env vars, never through `${{ }}`
    # expansion inside the script, so no input can inject shell syntax.
    # `--from "$DAIMONION_ACTION_PATH"` runs the checkout of this action at the
    # ref the caller pinned (politeuma/daimonion@<sha>), not the latest main.
    - name: Run daimonion
      shell: bash
      env:
        DAIMONION_ACTION_PATH: ${{ github.action_path }}
        DAIMONION_STRICT: ${{ inputs.strict }}
        DAIMONION_ADOPTION: ${{ inputs.adoption }}
        DAIMONION_ARGS: ${{ inputs.args }}
      run: |
        flags=()
        if [ "$DAIMONION_STRICT" = "true" ]; then
          flags+=(--strict)
        fi
        if [ "$DAIMONION_ADOPTION" = "true" ]; then
          flags+=(--adoption)
        fi
        # Word-split args into an array without glob or shell evaluation.
        read -r -a args <<< "$DAIMONION_ARGS"
        uvx --from "$DAIMONION_ACTION_PATH" daimonion "${flags[@]}" "${args[@]}"

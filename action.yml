name: daimonion
description: Scan git diffs and files against legal and ethical triggers.
inputs:
  strict:
    description: Fail the job when an L2 rule triggers.
    required: false
    default: "true"
  args:
    description: Arguments passed to daimonion (e.g. "diff" or "check src/").
    required: false
    default: diff
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

    - name: Run daimonion
      shell: bash
      run: |
        strict=""
        if [ "${{ inputs.strict }}" = "true" ]; then
          strict="--strict"
        fi
        # Intentionally unquoted: inputs.args may itself hold several words.
        uvx --from git+https://github.com/politeuma/daimonion daimonion $strict ${{ inputs.args }}

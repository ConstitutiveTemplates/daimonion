# Japanese translation of daimonion's human-facing CLI text.
#
# English (src/daimonion/i18n.py MESSAGES and the builtin rules in
# src/daimonion/rules.py) is canonical; this file translates it for
# `--lang ja` or a ja_* locale. A key missing here falls back to English.
# Keep the `{placeholders}` identical to the English strings.

messages:
  findings.none: 法令・コンプライアンス上のトリガーには一致しませんでした。
  findings.header: "daimonion: {areas} 件のコンプライアンス領域で {findings} 件のトリガーに一致しました:"
  findings.summary: "要約: {summary}"
  findings.where: "検出箇所:"
  findings.hit: 一致
  findings.line: 行
  findings.more: "... ほか {count} 件"
  findings.ignore_expired: "ignore の期限切れ {until}"
  findings.ignore_invalid: "ignore には reason=... が必要"
  footer.suppressed: "{count} 件はインラインの `daimonion: ignore[...]` 指定で抑制されました。"
  footer.baselined: "{count} 件はベースラインに記録済みのため数えていません。"
  baseline.wrote: "{count} 件を {path} に記録しました。以後は新しい検出だけを報告します。"
  baseline.missing: "ベースライン {path} がありません。--write-baseline で作成してください。"
  adoption.note: "導入モード: {count} 件の L2 検出は --strict なら失敗しますが、導入中は失敗させません。"
  scope.note: "{config} により {count} 件のルールに絞りました（すべて走査するには --all）"
  rules.header: "有効なコンプライアンスルール（{count} 件）:"
  rules.summary: "要約: {summary}"
  init.answers: "{path} を `when` 条件に変換しました:"
  init.answers_none: "回答から導かれる `when` 条件はありません。"
  init.header: "daimonion init — {path}"
  init.none: マニフェストやエージェント用ファイルから検出できた条件はありません。
  init.ask: "次の条件はファイルからは分からないので、必ず自分で判断してください: {conditions}"
  init.hint: "--write を付けると {name} として保存します。コメントアウトされた条件を見直してください。"
  init.exists: "{path} は既にあります。上書きするには --force を付けてください。"
  init.wrote: "{path} を書き込みました"
  init.next: "次に条件を見直し、`daimonion agents-md --write` を実行してください。"
  agents.no_config: "{repo!r} に {name} がありません。先に `daimonion init --write` を実行してください。"
  agents.current: "{path} のルールブロックは最新です（rulebook {sha}）。"
  agents.missing: "{path} にルールブロックがありません。`daimonion agents-md --write` を実行してください。"
  agents.stale: "{path} のルールブロックが古くなっています。`daimonion agents-md --write` を実行してください。"
  agents.updated: "{path} のルールブロックを更新しました"
  agents.up_to_date: "{path} は既に最新です。"

# Builtin rule titles and summaries (one rule per vendored check spec in
# src/daimonion/rulebook/checks/).
rules:
  accessibility/european-accessibility-act:
    title: 欧州アクセシビリティ法 (EAA) — EN 301 549 / WCAG 2.1 AA 準拠
    summary: 自動化できるWCAG 2.1 AA監査をCIで行い、alt欠落・tabindexトラップ等の静的シンクを残さない。
  ai/biometric-identification-gated:
    title: 生体識別ゲート — 法的根拠・同意・保存期間の明示
    summary: 生体識別コードごとに法的根拠・同意フロー・保存/破棄計画を示し、禁止用途を置かない。
  ai/llm-tool-allowlist-gate:
    title: LLMアプリ基盤 — ツールallowlist・人間承認・出力検証
    summary: モデルが呼べるツールを最小権限のallowlistで宣言し、破壊的操作には人間承認を挟み、実行前に出力を検証する。
  ai/ml-bias-mitigation:
    title: MLバイアス緩和 — サブグループ別評価と人間レビュー
    summary: 人に影響するモデルは保護サブグループ別の性能指標を示し、人口統計の学習/評価分割を記録し、高リスク判定を人間確認に回す。
  ai/samd-clinical-evaluation:
    title: SaMD臨床評価 — 診断主張はCIの評価ハーネスと変更管理で裏付ける
    summary: 診断主張はCI実行の評価ハーネスに対応付け、臨床モデルの変更は変更管理の範囲を引用し、臨床評価文書と市販後監視を備える。
  copyright/tdm-optout-respected:
    title: AI学習データ利用 — TDMオプトアウト尊重と出所記録
    summary: 学習に使う取得パイプラインは機械可読のTDMオプトアウトを確認し、学習コーパスごとに出所URLと評価結果を記録する。
  crypto/deprecated-algorithms-prohibited:
    title: 枯れた暗号 — MD5/SHA1署名・DES系・TLS 1.0/1.1 の新規採用禁止
    summary: 署名や完全性用途にMD5/SHA-1を用いず、DES/3DES/RC4・ECB・1024bit RSA・TLS 1.0/1.1 を新規コードと設定から排除する。
  licensing/no-copyleft-contamination:
    title: ライセンス変動 — 依存の現行ライセンス確認とコピーレフト混入防止
    summary: 出荷物に含まれる依存・同梱コードの現行ライセンスを確認し、強いコピーレフトの混入は方針ファイルの決定記録と照合する。
  privacy/cleartext-pii-logging-prohibited:
    title: 個人データ — ログ・テレメトリへの平文PII出力禁止
    summary: 個人識別子をマスク・ハッシュ・削除せずにログやエラー報告へ出さない。全シンクのペイロードを出す前に減らす。
  privacy/external-transmission-declared:
    title: 外部送信規律 — 第三者送信の登録と同意ゲート
    summary: 利用者識別子の第三者送信は送信先・目的・法域タグ付きで登録し、求められる体制では同意ゲートを通す。
  security/prompt-injection-defense:
    title: プロンプトインジェクション — 外部入力を指示として直接実行しない
    summary: 指示と外部データを厳格に分離し、外部テキストをシステム指示として信用しない。ツール出力の再投入は境界を明示する。
  security/public-ntp-hygiene:
    title: NTPハイジーン — 単一機関の公開NTP固定禁止
    summary: 単一機関のNTPホスト名・アドレスリテラルを出荷コードにハードコードせず、プール基盤または利用者設定可能なエンドポイントを使う。
  security/sbom-present:
    title: SBOMと脆弱性対応 — リリースごとSBOM・連絡窓口・既知CVEなし
    summary: リリースごとにSBOM成果物を添え、監視される脆弱性連絡窓口を持ち、未対応の悪用可能CVEを残さない。
  security/vdp-contact-published:
    title: 脆弱性開示 — 外部報告の公開チャネル
    summary: SECURITY.mdやsecurity.txt等の発見可能な面で、監視される報告先(連絡先・フォーム・対応期限)を公表する。

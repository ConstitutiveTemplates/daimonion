name: ethics-parity

# Weekly guard: every active section in kanon's sections/MANIFEST.yml (the
# canonical rulebook) must stay covered by a daimonion rule with agreeing
# triggers, gated whenever the section's `when` is conditional. Upstream kanon
# main is compared, so drift shows before the vendored snapshot is refreshed.
# On drift it files one `drift`-labelled issue (reuses the open one when it
# exists). The vendored snapshot itself is checked by the test suite.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # file the drift issue
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: politeuma/kanon
          path: kanon
          sparse-checkout: sections
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check ethics parity
        run: |
          uv run --no-sync python tools/check_ethics_parity.py --manifest kanon/sections/MANIFEST.yml > parity.txt 2>&1
          rc=$?
          cat parity.txt
          exit $rc

      - name: Open drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          body=$(cat parity.txt)
          existing=$(gh issue list --search "Ethics parity drift" --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Ethics parity drift (run $RUN_ID)" \
              --label "drift" \
              --body "$body"$'\n\n'"See: $RUN_URL"
          else
            echo "A parity drift issue is already open; skipping."
          fi

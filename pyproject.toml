[project]
name = "daimonion"
version = "0.1.0"
description = "Fast, lightweight linter that matches code and git diffs against legal and ethical triggers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "politeuma Contributors" }]
requires-python = ">=3.11"
keywords = ["linter", "compliance", "legal", "agents-md", "pre-commit", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/politeuma/daimonion"
Repository = "https://github.com/politeuma/daimonion"
Issues = "https://github.com/politeuma/daimonion/issues"
Changelog = "https://github.com/politeuma/daimonion/blob/main/CHANGELOG.md"

[project.scripts]
daimonion = "daimonion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# The evals/ package is imported by tests/test_evals.py; bare `pytest` does
# not put rootdir on sys.path, so the import needs an explicit path entry.
pythonpath = ["."]
